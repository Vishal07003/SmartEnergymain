        type, room, device, or time range.
      summary: List Telemetry Readings
      parameters:
      - in: query
        name: device
        schema:
          type: integer
      - in: query
        name: end_time
        schema:
          type: string
          format: date-time
      - in: query
        name: hardware_id
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: room
        schema:
          type: integer
      - in: query
        name: room_number
        schema:
          type: string
      - in: query
        name: sensor
        schema:
          type: integer
      - in: query
        name: sensor_type
        schema:
          type: string
          enum:
          - AMBIENT_LIGHT
          - CURRENT_POWER
          - HUMIDITY
          - PIR_MOTION
          - SOUND_ACOUSTIC
          - TEMPERATURE
        description: |-
          * `PIR_MOTION` - PIR Motion Sensor
          * `TEMPERATURE` - Temperature Sensor
          * `HUMIDITY` - Humidity Sensor
          * `AMBIENT_LIGHT` - Ambient Light (Lux) Sensor
          * `SOUND_ACOUSTIC` - Sound / Acoustic Sensor
          * `CURRENT_POWER` - Current / Power CT Clamp
      - in: query
        name: start_time
        schema:
          type: string
          format: date-time
      tags:
      - telemetry
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTelemetryReadingList'
          description: ''
  /api/v1/telemetry/readings/{id}/:
    get:
      operationId: telemetry_readings_retrieve
      description: View a specific telemetry measurement.
      summary: Get Telemetry Reading Record
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this telemetry reading.
