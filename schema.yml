openapi: 3.0.3
info:
  title: Smart Energy Manager API
  version: 1.0.0
  description: Institutional Multi-Floor Campus Energy Management and ESP32 IoT Backend
paths:
  /api/v1/accounts/profile/:
    get:
      operationId: accounts_profile_retrieve
      description: Returns detailed profile, department, block, and preference settings
        for the authenticated user.
      summary: Get Current User Profile
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserProfile'
          description: ''
    patch:
      operationId: accounts_profile_partial_update
      description: Allows the authenticated staff member to update email, name, phone,
        or notification preferences.
      summary: Update Current User Profile
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserProfile'
          description: ''
  /api/v1/alerts/:
    get:
      operationId: alerts_list
      description: Search, filter, and paginate through campus energy anomalies and
        system alerts.
      summary: List Alerts
      parameters:
      - in: query
        name: building
        schema:
          type: integer
      - in: query
        name: building_code
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
          enum:
          - DEVICE_OFFLINE
          - ENERGY_WASTE
          - HIGH_TEMPERATURE
          - OCCUPANCY_ANOMALY
          - SAFETY_TRIGGER
          - THRESHOLD_EXCEEDED
        description: |-
          * `ENERGY_WASTE` - Energy Waste
          * `OCCUPANCY_ANOMALY` - Occupancy Anomaly
          * `DEVICE_OFFLINE` - Device Offline
          * `HIGH_TEMPERATURE` - High Temperature
          * `SAFETY_TRIGGER` - Safety Trigger
          * `THRESHOLD_EXCEEDED` - Threshold Exceeded
      - in: query
        name: device
        schema:
          type: integer
      - in: query
        name: end_time
        schema:
          type: string
          format: date-time
      - in: query
        name: floor
        schema:
          type: integer
      - in: query
        name: floor_level
        schema:
          type: integer
      - in: query
        name: hardware_id
        schema:
          type: string
      - in: query
        name: is_acknowledged
        schema:
          type: boolean
      - in: query
        name: is_resolved
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: room
        schema:
          type: integer
      - in: query
        name: room_number
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - CRITICAL
          - HIGH
          - INFO
          - LOW
          - MEDIUM
          - WARNING
        description: |-
          * `CRITICAL` - Critical
          * `HIGH` - High
          * `MEDIUM` - Medium
          * `LOW` - Low
          * `WARNING` - Warning
          * `INFO` - Informational
      - in: query
        name: start_time
        schema:
          type: string
          format: date-time
      tags:
      - alerts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAIAlertListList'
          description: ''
  /api/v1/alerts/{id}/:
    get:
      operationId: alerts_retrieve
      description: Retrieve detailed alert diagnoses, possible causes, and recommended
        actions.
      summary: Get Alert Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai alert.
        required: true
      tags:
      - alerts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAlertDetail'
          description: ''
  /api/v1/alerts/{id}/acknowledge/:
    post:
      operationId: alerts_acknowledge_create
      description: Mark an alert as acknowledged by the current staff member/administrator.
      summary: Acknowledge Alert
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai alert.
        required: true
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIAlertListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIAlertListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIAlertListRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertActionResponse'
          description: ''
    patch:
      operationId: alerts_acknowledge_partial_update
      description: Mark an alert as acknowledged by the current staff member/administrator.
      summary: Acknowledge Alert
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai alert.
        required: true
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAIAlertListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAIAlertListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAIAlertListRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertActionResponse'
          description: ''
  /api/v1/alerts/{id}/resolve/:
    post:
      operationId: alerts_resolve_create
      description: Mark an anomaly or system alert as resolved and closed.
      summary: Resolve Alert
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai alert.
        required: true
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIAlertListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIAlertListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIAlertListRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertActionResponse'
          description: ''
    patch:
      operationId: alerts_resolve_partial_update
      description: Mark an anomaly or system alert as resolved and closed.
      summary: Resolve Alert
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai alert.
        required: true
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAIAlertListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAIAlertListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAIAlertListRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertActionResponse'
          description: ''
  /api/v1/alerts/scan/:
    post:
      operationId: alerts_scan_create
      description: Executes rule-based energy and device anomaly detection, evaluating
        vacant room wastage and device heartbeats.
      summary: Trigger Anomaly Scan
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnomalyScanResponseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnomalyScanResponseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnomalyScanResponseRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnomalyScanResponse'
          description: ''
  /api/v1/alerts/summary/:
    get:
      operationId: alerts_summary_retrieve
      description: Returns counts of active, unresolved alerts segmented by CRITICAL,
        HIGH, MEDIUM, and LOW severity.
      summary: Alerts Summary
      tags:
      - alerts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSummary'
          description: ''
  /api/v1/analytics/buildings/:
    get:
      operationId: analytics_buildings_retrieve
      description: Compares cumulative energy consumption across all campus buildings
        for the designated trailing period.
      summary: Building Energy Comparison
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          default: 30
        description: 'Trailing period in days (default: 30)'
      tags:
      - analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingComparisonResponse'
          description: ''
  /api/v1/analytics/summary/:
    get:
      operationId: analytics_summary_retrieve
      description: Returns total kWh consumption, average power, peak power, and room
        breakdowns for institutional audits.
      summary: Campus Energy Analytics Summary
      parameters:
      - in: query
        name: building_id
        schema:
          type: integer
        description: Filter by building ID
      - in: query
        name: days
        schema:
          type: integer
          default: 7
        description: 'Number of trailing days (default: 7)'
      - in: query
        name: room_id
        schema:
          type: integer
        description: Filter by room ID
      tags:
      - analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampusEnergySummary'
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Securely changes the user's password following Django's password
        validation rules.
      summary: Change Password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Validation error or incorrect old password
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates staff or administrator, returning JWT access & refresh
        tokens along with institutional role details.
      summary: User Login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
        '401':
          description: Invalid credentials
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the provided JWT refresh token, preventing further token
        renewals.
      summary: User Logout
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Successfully logged out
        '400':
          description: Invalid or expired token
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns detailed profile, department, block, and preference settings
        for the authenticated user.
      summary: Get Current User Profile
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserProfile'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Allows the authenticated staff member to update email, name, phone,
        or notification preferences.
      summary: Update Current User Profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserProfile'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/devices/:
    get:
      operationId: devices_list
      description: Filter, search, and paginate through institutional ESP32 nodes
        and smart controllers.
      summary: List Campus Devices
      parameters:
      - in: query
        name: automation_enabled
        schema:
          type: boolean
      - in: query
        name: building
        schema:
          type: integer
        description: Filter by building ID
      - in: query
        name: building_code
        schema:
          type: string
        description: Filter by building code (e.g. BLD-ST)
      - in: query
        name: device_type
        schema:
          type: string
        description: 'Filter by device type: ESP32_NODE, RELAY_MODULE, etc.'
      - in: query
        name: floor
        schema:
          type: integer
        description: Filter by floor ID
      - in: query
        name: floor_level
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: room
        schema:
          type: integer
        description: Filter by room ID
      - in: query
        name: room_number
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
        description: 'Filter by configured status: ONLINE, OFFLINE, DEGRADED'
      tags:
      - devices
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeviceListList'
          description: ''
    post:
      operationId: devices_create
      description: Register a new ESP32 device with hardware ID validation and optional
        channel initialization (Admin only).
      summary: Register Device
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCreate'
          description: ''
  /api/v1/devices/{id}/:
    get:
      operationId: devices_retrieve
      description: Retrieve full device telemetry metadata, relay channels, and calculated
        live heartbeat status.
      summary: Get Device Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      tags:
      - devices
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetail'
          description: ''
    put:
      operationId: devices_update
      description: Update device settings, firmware version, and Wi-Fi configurations
        (Admin only).
      summary: Update Device
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceListRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
          description: ''
    patch:
      operationId: devices_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDeviceListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDeviceListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDeviceListRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
          description: ''
    delete:
      operationId: devices_destroy
      description: Remove a device from campus inventory (Admin only).
      summary: Deregister Device
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      tags:
      - devices
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/devices/{id}/assign-room/:
    post:
      operationId: devices_assign_room_create
      description: Change or set the room assignment for this device with strict validation
        (Admin only).
      summary: Assign Device to Room
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoomRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignRoomRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignRoomRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Room assigned successfully
        '400':
          description: Invalid room ID or inactive room
    patch:
      operationId: devices_assign_room_partial_update
      description: Change or set the room assignment for this device with strict validation
        (Admin only).
      summary: Assign Device to Room
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssignRoomRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssignRoomRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssignRoomRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Room assigned successfully
        '400':
          description: Invalid room ID or inactive room
  /api/v1/devices/{id}/channels/:
    get:
      operationId: devices_channels_list
      description: Returns all controllable and fixed relay channels configured for
        this device.
      summary: List Relay Channels
      parameters:
      - in: query
        name: automation_enabled
        schema:
          type: boolean
      - in: query
        name: building
        schema:
          type: integer
      - in: query
        name: building_code
        schema:
          type: string
      - in: query
        name: device_type
        schema:
          type: string
          enum:
          - CURRENT_SENSOR
          - ESP32_NODE
          - HVAC_FAN_CONTROLLER
          - LIGHTING_BANK
          - RELAY_MODULE
          - SMART_POWER_SOCKET
        description: |-
          * `ESP32_NODE` - ESP32 Node
          * `RELAY_MODULE` - Relay Module
          * `SMART_POWER_SOCKET` - Smart Power Socket
          * `CURRENT_SENSOR` - Current Sensor
          * `LIGHTING_BANK` - Lighting Bank
          * `HVAC_FAN_CONTROLLER` - HVAC / Fan Controller
      - in: query
        name: floor
        schema:
          type: integer
      - in: query
        name: floor_level
        schema:
          type: integer
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: room
        schema:
          type: integer
      - in: query
        name: room_number
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
